# nginx site for PingZest. setup-server.sh replaces DOMAIN; certbot adds the SSL lines.
# Do NOT add X-Frame-Options: the app runs inside the Shopify admin (an iframe);
# the app sets the right Content-Security-Policy frame-ancestors itself.

upstream pingzest_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Webhooks and the storefront counter can arrive in bursts.
limit_req_zone $binary_remote_addr zone=pz_public:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    # certbot --nginx turns this into a redirect to HTTPS and adds the 443 server.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    client_max_body_size 2m;           # webhooks and forms are small
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Built JS/CSS have hashed names: cache for a year.
    location /assets/ {
        proxy_pass http://pingzest_app;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /healthz {
        proxy_pass http://pingzest_app;
        access_log off;
    }

    location ~ ^/(webhooks|proxy|c)/ {
        limit_req zone=pz_public burst=60 nodelay;
        proxy_pass http://pingzest_app;
        include /etc/nginx/snippets/pingzest-proxy.conf;
    }

    location / {
        proxy_pass http://pingzest_app;
        include /etc/nginx/snippets/pingzest-proxy.conf;
    }
}
