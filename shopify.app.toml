# App in the Dev Dashboard (client ID is public; the secret lives only in the server's .env).
# URLs below are placeholders until the server is live; CI replaces example.com with APP_DOMAIN on deploy.
client_id = "382db2fa7690ec9071c045e65bc1cc00"
name = "PingZest"
application_url = "https://example.com"
embedded = true

[build]
dev_store_url = "golibar-mrv1ujxf.myshopify.com"
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[access_scopes]
# read_orders also covers checkouts (abandoned checkouts) and fulfillments webhooks.
# write_orders lets the confirm page tag orders as confirmed / cancelled.
# read/write_discounts let merchants create discount codes for the discount banner.
# write_order_edits applies the "pay online and save" discount to a COD order (Pro).
# write_merchant_managed_fulfillment_orders holds fulfillment of a COD order until the customer confirms
#   (Settings → Orders → COD follow-up) and releases it on confirm. orderCancel (cancel + restock) uses write_orders.
# read_fulfillments is needed for the fulfillments/* webhooks (shipped / delivered messages).
# write_app_proxy is required because the app has an app proxy (/apps/pingzest).
scopes = "read_orders,write_orders,read_fulfillments,read_discounts,write_discounts,read_locales,write_order_edits,write_merchant_managed_fulfillment_orders,write_app_proxy"

[auth]
redirect_urls = ["https://example.com/auth/callback"]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = ["orders/create"]
  uri = "/webhooks/orders"

  # Payment received (used to detect COD orders switched to prepaid)
  [[webhooks.subscriptions]]
  topics = ["orders/paid"]
  uri = "/webhooks/orders-paid"

  # Plan changes: subscribe, cancel, payment failed
  [[webhooks.subscriptions]]
  topics = ["app_subscriptions/update"]
  uri = "/webhooks/app/subscriptions_update"

  [[webhooks.subscriptions]]
  topics = ["checkouts/create", "checkouts/update"]
  uri = "/webhooks/checkouts"

  [[webhooks.subscriptions]]
  topics = ["fulfillments/create", "fulfillments/update"]
  uri = "/webhooks/fulfillments"

  # Mandatory privacy webhooks (required for the App Store)
  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "/webhooks/compliance"

# Storefront widgets post click counts to https://{shop}/apps/pingzest/track
# Shopify forwards them (signed) to {application_url}/proxy/track
[app_proxy]
url = "https://example.com/proxy"
subpath = "pingzest"
prefix = "apps"

[pos]
embedded = false
