# Cloud tests on every push: build with the real packages, a real MongoDB replica set,
# the production server called the way Shopify calls it, and the browser tests.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: mongodb://localhost:27017/pingzest_ci?replicaSet=rs0&directConnection=true
      SHOPIFY_API_KEY: ci-api-key
      SHOPIFY_API_SECRET: ci-api-secret
      SHOPIFY_APP_URL: http://localhost:3000
      SCOPES: read_orders,write_orders,read_fulfillments,read_discounts,write_discounts,read_locales,write_order_edits,write_merchant_managed_fulfillment_orders,write_app_proxy
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start MongoDB (one-node replica set, as Prisma needs)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }" && break
            sleep 2
          done
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "db.hello().isWritablePrimary" | grep -q true && echo "MongoDB ready" && break
            sleep 2
          done

      - name: Install
        run: npm install --no-audit --no-fund --include=dev
        env:
          NODE_ENV: development

      - name: "Prisma — validate, generate, create collections and indexes"
        run: |
          npx prisma validate
          npx prisma generate
          npx prisma db push --skip-generate

      - name: Storefront script is built from widget-src (and the theme block loader is under 10 KB)
        run: |
          node scripts/build-widget.mjs --check || {
            node scripts/build-widget.mjs
            # The built files, for copying when they can't be built locally.
            for f in extensions/pingzest-widgets/assets/wa-widget*.js; do echo "BUILT-FILE $f $(gzip -9c "$f" | base64 -w0)"; done
            exit 1
          }

      - name: Unit tests
        run: npm test

      - name: Translation coverage
        run: node scripts/extract-i18n.mjs --check

      - name: Build (production)
        run: npm run build

      - name: Integration tests (real server + MongoDB, signed webhooks, fake PostHog)
        run: npm run test:integration

      - name: "End-to-end: every admin page and action against a fake Shopify (HTTPS)"
        run: |
          mkdir -p /tmp/e2e
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=e2e-store.myshopify.com" \
            -addext "subjectAltName=DNS:e2e-store.myshopify.com" -keyout /tmp/e2e/key.pem -out /tmp/e2e/cert.pem 2>/dev/null
          echo "127.0.0.1 e2e-store.myshopify.com" | sudo tee -a /etc/hosts
          sudo iptables -t nat -A OUTPUT -o lo -p tcp --dport 443 -j REDIRECT --to-ports 8443
          npm install --no-save --no-audit --no-fund graphql@16
          node scripts/fetch-admin-schema.mjs /tmp/e2e/admin-schema.json
          E2E_ADMIN_SCHEMA=/tmp/e2e/admin-schema.json npm run test:e2e

      - name: "End-to-end again on the Vite dev server (what shopify app dev runs locally)"
        run: E2E_SERVER=dev E2E_ADMIN_SCHEMA=/tmp/e2e/admin-schema.json npm run test:e2e

      - name: E2E server log (on failure)
        if: failure()
        run: tail -300 /tmp/pingzest-e2e-server.log 2>/dev/null || true

      - name: Test-data script (npm run test:webhooks) against the production server
        run: |
          PORT=3000 npx react-router-serve ./build/server/index.js > /tmp/pingzest-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS localhost:3000/healthz >/dev/null && break; sleep 1; done
          SHOP=ci-seed.myshopify.com npm run test:webhooks -- --privacy | tee /tmp/seed.log
          grep -q "Confirm pages" /tmp/seed.log
          kill %1 || true

      - name: Install Playwright + Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1 graphql@16
          npx playwright install --with-deps chromium
        env:
          NODE_ENV: development

      - name: Storefront widget tests (browser)
        run: npm run test:widgets

      - name: "End-to-end in the browser: sidebar, every page, settings form, mobile menu, confirm page"
        run: E2E_ADMIN_SCHEMA=/tmp/e2e/admin-schema.json npm run test:e2e:browser

      - name: Screenshots for review (small JPEGs, base64)
        if: always()
        run: |
          for f in test/e2e/screenshots/*.jpg; do
            [ -f "$f" ] || continue
            n=0; base64 -w 4000 "$f" | while read -r chunk; do n=$((n+1)); echo "SHOT $(basename "$f") $n $chunk"; done
          done
          true

      - name: Browser E2E server log (on failure)
        if: failure()
        run: tail -200 /tmp/pingzest-e2e-browser.log 2>/dev/null || true

      - name: Server log (on failure)
        if: failure()
        run: cat /tmp/pingzest-server.log 2>/dev/null | tail -200 || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            test/widgets/*.png
            test/e2e/screenshots/*.png
          if-no-files-found: ignore

  # Deploys main to your server after all tests pass. Turned on by setting the repository
  # variable DEPLOY_HOST (and DEPLOY_USER + secret DEPLOY_SSH_KEY); see docs/DEPLOY.md.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: |
          npm install --no-audit --no-fund --include=dev
          npm run build
        env:
          NODE_ENV: production

      - name: Package release
        run: tar -czf /tmp/pingzest-${{ github.sha }}.tgz build package.json prisma ecosystem.config.cjs deploy public

      - name: Upload and release on the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ vars.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER || 'deploy' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          scp -q /tmp/pingzest-${{ github.sha }}.tgz "$USER@$HOST:/tmp/"
          ssh "$USER@$HOST" "tar -xzf /tmp/pingzest-${{ github.sha }}.tgz -O deploy/release.sh > /tmp/pingzest-release.sh && bash /tmp/pingzest-release.sh ${{ github.sha }}"

      - name: Push app config, webhooks and theme extension to Shopify
        if: vars.APP_DOMAIN != ''
        env:
          SHOPIFY_CLI_PARTNERS_TOKEN: ${{ secrets.SHOPIFY_CLI_PARTNERS_TOKEN }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
        run: |
          if [ -z "$SHOPIFY_CLI_PARTNERS_TOKEN" ]; then echo "::warning::Add the SHOPIFY_CLI_PARTNERS_TOKEN secret to push the app config to Shopify"; exit 0; fi
          sed -i "s#https://example.com#https://$APP_DOMAIN#g" shopify.app.toml
          npx -y @shopify/cli@3 app deploy --allow-updates --message "CI ${GITHUB_SHA::7}"

      - name: Check the live site
        run: curl -fsS --retry 5 --retry-delay 3 "https://${{ vars.APP_DOMAIN || vars.DEPLOY_HOST }}/healthz" || echo "::warning::Couldn't reach the public URL (set the APP_DOMAIN variable to check it)"
