# Cloud tests on every push: build with the real packages, a real MongoDB replica set,
# the production server called the way Shopify calls it, and the browser tests.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: mongodb://localhost:27017/pingzest_ci?replicaSet=rs0&directConnection=true
      SHOPIFY_API_KEY: ci-api-key
      SHOPIFY_API_SECRET: ci-api-secret
      SHOPIFY_APP_URL: http://localhost:3000
      SCOPES: read_orders,write_orders,read_discounts,write_discounts,read_locales,write_order_edits
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start MongoDB (one-node replica set, as Prisma needs)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }" && break
            sleep 2
          done
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "db.hello().isWritablePrimary" | grep -q true && echo "MongoDB ready" && break
            sleep 2
          done

      - name: Install
        run: npm install --no-audit --no-fund --include=dev
        env:
          NODE_ENV: development

      - name: Prisma: validate, generate, create collections and indexes
        run: |
          npx prisma validate
          npx prisma generate
          npx prisma db push --skip-generate

      - name: Unit tests
        run: npm test

      - name: Translation coverage
        run: node scripts/extract-i18n.mjs --check

      - name: Build (production)
        run: npm run build

      - name: Integration tests (real server + MongoDB, signed webhooks, fake PostHog)
        run: npm run test:integration

      - name: Install Playwright + Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
        env:
          NODE_ENV: development

      - name: Storefront widget tests (browser)
        run: npm run test:widgets

      - name: Server log (on failure)
        if: failure()
        run: cat /tmp/pingzest-server.log 2>/dev/null | tail -200 || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test/widgets/*.png
          if-no-files-found: ignore
