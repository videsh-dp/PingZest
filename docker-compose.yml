# Local MongoDB for development: `docker compose up -d`
# Prisma needs MongoDB to run as a replica set (it uses transactions), so this starts a one-node set.
services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports: ["27017:27017"]
    volumes: ["pingzest-mongo:/data/db"]
    healthcheck:
      # Starts the replica set on first run, then reports healthy.
      test: echo "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) }" | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 10s
      start_period: 5s
      retries: 30
volumes:
  pingzest-mongo:
